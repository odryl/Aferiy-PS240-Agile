name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall custom_components/aecc_battery tests
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run regression tests
        run: python -m pytest tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard syntax and behavior
        run: |
          node --check custom_components/aecc_battery/frontend/aferiy-agile-plan-card.js
          node --test tests/test_cosy_card.cjs
