name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS integration archive
        working-directory: custom_components/aecc_battery
        run: >-
          zip -r "$GITHUB_WORKSPACE/aecc_battery.zip" .
          -x "*.pyc" "__pycache__/*" "*/__pycache__/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" aecc_battery.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
