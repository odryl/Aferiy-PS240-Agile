<!doctype html>
<html lang="en-GB">

<title>AFERIY Wi-Fi loss recovery card · implementation preview</title>
<!--
  Development preview: loads the shipped card file directly and stubs the two
  Home Assistant elements it uses (ha-card, ha-icon) so the real markup, CSS and
  state mapping can be eyeballed in a plain browser. Nothing here ships.
-->
<style>
  :root{
    --primary-color:#4498c3; --success-color:#5d9e52; --warning-color:#d9a441; --error-color:#db5365;
    --card-background-color:#1c1c1c; --ha-card-background:#1c1c1c; --secondary-background-color:#282828;
    --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#3a3a3a;
    --text-primary-color:#ffffff; --ha-card-border-radius:20px; color-scheme:dark;
  }
  body{margin:0;padding:28px;background:#111;color:#e1e1e1;
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  h1{font-size:15px;font-weight:500;margin:0 0 4px}
  p.lede{margin:0 0 24px;font-size:13px;color:#9b9b9b}
  .grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-items:start}
  figure{margin:0;max-width:var(--card-width,430px)}
  figcaption{margin-bottom:9px;font-size:12px;color:#9b9b9b}
  ha-card{display:block;background:var(--ha-card-background);border-radius:var(--ha-card-border-radius);
    box-shadow:var(--ha-card-box-shadow,0 2px 8px rgba(0,0,0,.28));overflow:hidden}
  ha-icon{display:block}
</style>
</head>
<body>

customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  constructor() { super(); this.attachShadow({ mode: "open" }); }
  attributeChangedCallback() { this._draw(); }
  connectedCallback() { this._draw(); }
  _draw() {
    const path = MDI[this.getAttribute("icon")] || MDI["mdi:wifi"];
    // The sizing rule lives in this shadow root so the card's --mdc-icon-size
    // (set inside the card's own shadow root) is inherited across the boundary.
    this.shadowRoot.innerHTML = `<style>svg{width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor;display:block}</style>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"></path></svg>`;
  }
});
window.customCards = [];

<script src="../../custom_components/aecc_battery/frontend/aferiy-wifi-recovery-card.js"></script>
<script>
const MINUTE = 60000;
const at = (minutes) => new Date(Date.now() + minutes * MINUTE).toISOString();
const base = {
  configured: true, router_model: "Linksys MX4200", allowed_channels: [6, 11],
  trigger_after_consecutive_failures: 6, current_consecutive_failures: 0, battery_available: true,
  cooldown_hours: 1, grace_period_minutes: 6, grace_period_ends_at: null, last_attempt_at: null,
  next_allowed_attempt_at: null, requested_channel: null, last_result: null,
  last_battery_recovery_at: null, current_2_4ghz_channel: 6,
  policy: "One 6/11 channel toggle per outage after the battery becomes unavailable.",
};
const monitoring = { ...base, status: "Monitoring", reason: "Waiting for the PS240 to become unavailable after sustained poll failures." };
const FIXTURES = [
  ["Monitoring · armed", "on", monitoring],
  ["Grace period · live countdown", "on", { ...base, status: "Grace period", current_consecutive_failures: 6, battery_available: false, grace_period_ends_at: at(5.7) }],
  ["Changing channel", "on", { ...base, status: "Changing channel", current_consecutive_failures: 6, battery_available: false, requested_channel: 11 }],
  ["Recovered", "on", { ...base, status: "Recovered", current_2_4ghz_channel: 11, requested_channel: 11, last_result: "verified", last_attempt_at: at(-3), last_battery_recovery_at: at(-1.4) }],
  ["Cooldown", "on", { ...base, status: "Cooldown", current_consecutive_failures: 6, battery_available: false, current_2_4ghz_channel: 11, requested_channel: 11, last_result: "verified", last_attempt_at: at(-18), next_allowed_attempt_at: at(41.6) }],
  ["Failed", "on", { ...base, status: "Failed", current_consecutive_failures: 6, battery_available: false, requested_channel: 11, last_result: "failed", last_attempt_at: at(-9) }],
  ["Recovery off", "off", { ...base, status: "Off", reason: "Wi-Fi loss recovery is off." }],
  ["Router not configured", "off", { ...base, status: "Configuration required", configured: false, router_model: null, current_2_4ghz_channel: null, reason: "Add the Linksys router address and local administrator password in the integration options." }],
];
const requestedWidth = new URLSearchParams(location.search).get("width");
if (requestedWidth) document.documentElement.style.setProperty("--card-width", `${Number(requestedWidth)}px`);
const grid = document.getElementById("grid");
for (const [label, switchState, attributes] of FIXTURES) {
  const figure = document.createElement("figure");
  const caption = document.createElement("figcaption");
  caption.textContent = `${label} · status ${attributes.status}`;
  const card = document.createElement("aferiy-wifi-recovery-card");
  card.setConfig({});
  card.hass = {
    states: {
      "switch.battery_wifi_loss_recovery": { entity_id: "switch.battery_wifi_loss_recovery", state: switchState, attributes },
      "number.battery_wifi_recovery_grace_period": { entity_id: "number.battery_wifi_recovery_grace_period", state: String(attributes.grace_period_minutes), attributes: { min: 0, max: 60 } },
    },
    config: { time_zone: "Europe/London" },
    callService: async () => {},
  };
  figure.append(caption, card);
  grid.append(figure);
}
// The open details block is shown by default so the guardrails stay visible.
setTimeout(() => {
  document.querySelectorAll("aferiy-wifi-recovery-card").forEach((card) => {
    if (!card._root.querySelector(".wr-more")) return;
    card._root.querySelector("details.wr-more").open = true;
  });
}, 250);
</script>
